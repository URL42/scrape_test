[project]
name = "scrape-test"
version = "0.1.0"
description = "YC prospecting + current-events scraper with a simple front end"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "feedparser>=6.0.11",
    "selectolax>=0.3.21",
    "anthropic>=1.6.0",
    "openai>=3.14.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
scrape-test = "scrape_test.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrape_test"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
packages = ["scrape_test"]
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["feedparser.*", "selectolax.*"]
ignore_missing_imports = true
